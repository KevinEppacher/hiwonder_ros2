x-ros-environment: &ros-environment
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  CYCLONEDDS_URI: file:///config/cyclonedds/cyclonedds.xml

services:
  so101-leader-follower-bringup:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    devices:
      - ${LEADER_PORT}:/dev/so101_leader
      - ${FOLLOWER_PORT}:/dev/so101_follower
    volumes:
      - ./config:/config:ro
    environment:
      <<: *ros-environment
    command:
      [
        "ros2",
        "launch",
        "lerobot_bringup",
        "so101_leader_follower_bringup.launch.xml",
        "leader_port:=/dev/so101_leader",
        "follower_port:=/dev/so101_follower",
        "leader_calibration_path:=/config/calibration/leader_example_calibration.yaml",
        "follower_calibration_path:=/config/calibration/follower_example_calibration.yaml",
        "gui:=false"
      ]

  so101-leader-bringup:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    devices:
      - ${LEADER_PORT}:/dev/so101_leader
    volumes:
      - ./config:/config:ro
    environment:
      <<: *ros-environment
    command:
      [
        "ros2",
        "launch",
        "lerobot_bringup",
        "so101_leader_bringup.launch.py",
        "port:=/dev/so101_leader",
        "calibration_path:=/config/calibration/leader_example_calibration.yaml",
        "gui:=false"
      ]

  so101-follower-bringup:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    restart: unless-stopped
    devices:
      - ${FOLLOWER_PORT}:/dev/so101_follower
    volumes:
      - ./config:/config:ro
    environment:
      <<: *ros-environment
    command:
      [
        "ros2",
        "launch",
        "lerobot_bringup",
        "so101_follower_bringup.launch.py",
        "port:=/dev/so101_follower",
        "calibration_path:=/config/calibration/follower_example_calibration.yaml",
        "gui:=false"
      ]

  so101-follower-camera-bringup:
    image: ghcr.io/kevineppacher/lerobot-ros2-vision:jazzy
    network_mode: host
    devices:
      - ${FOLLOWER_VIDEO_DEVICE}:/dev/video0
    volumes:
      - ./config:/config:ro
    environment:
      <<: *ros-environment
    command:
      [
        "ros2",
        "launch",
        "lerobot_vision_bringup",
        "follower_camera_bringup.launch.py",
        "video_device:=/dev/video0"
      ]

  lerobot-list-cameras:
    image: ghcr.io/kevineppacher/lerobot-ros2-vision:jazzy
    network_mode: host
    privileged: true
    volumes:
      - /dev:/dev
    command: ["lerobot-list-cameras"]

  lerobot-teleop:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    volumes:
      - ./config:/config:ro
    environment:
      <<: *ros-environment
    command:
      [
        "ros2",
        "launch",
        "lerobot_teleop",
        "leader_follower_teleop.launch.py"
      ]

  hiwonder-find-port:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    privileged: true
    volumes:
      - /dev:/dev
    command: ["hiwonder-find-port"]

  hiwonder-scan-leader:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    devices:
      - ${LEADER_PORT}:/dev/hiwonder
    command: ["hiwonder-scan", "/dev/hiwonder"]

  hiwonder-scan-follower:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    devices:
      - ${FOLLOWER_PORT}:/dev/hiwonder
    command: ["hiwonder-scan", "/dev/hiwonder"]

  hiwonder-setup-motors-leader:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    devices:
      - ${LEADER_PORT}:/dev/hiwonder
    command: ["hiwonder-setup-motors", "/dev/hiwonder"]

  hiwonder-setup-motors-follower:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    devices:
      - ${FOLLOWER_PORT}:/dev/hiwonder
    command: ["hiwonder-setup-motors", "/dev/hiwonder"]

  lerobot-calibrate-leader:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    devices:
      - ${LEADER_PORT}:/dev/hiwonder
    volumes:
      - ./config:/config
    command:
      [
        "lerobot-calibrate",
        "/dev/hiwonder",
        "/config/leader_example_calibration.yaml"
      ]

  lerobot-calibrate-follower:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    devices:
      - ${FOLLOWER_PORT}:/dev/hiwonder
    volumes:
      - ./config:/config
    command:
      [
        "lerobot-calibrate",
        "/dev/hiwonder",
        "/config/follower_example_calibration.yaml"
      ]

  lerobot-test-move-leader:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    devices:
      - ${LEADER_PORT}:/dev/hiwonder
    command: ["lerobot-test-move", "/dev/hiwonder"]

  lerobot-test-move-follower:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    devices:
      - ${FOLLOWER_PORT}:/dev/hiwonder
    command: ["lerobot-test-move", "/dev/hiwonder"]

  lerobot-torque-mode-leader:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    devices:
      - ${LEADER_PORT}:/dev/hiwonder
    command: ["lerobot-torque-mode", "/dev/hiwonder"]

  lerobot-torque-mode-follower:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    devices:
      - ${FOLLOWER_PORT}:/dev/hiwonder
    command: ["lerobot-torque-mode", "/dev/hiwonder"]

  workstation_zenoh_bridge:
    profiles: ["workstation"]
    image: eclipse/zenoh-bridge-ros2dds:latest
    network_mode: host
    restart: unless-stopped
    environment:
      - ROS_DISTRO=jazzy
      # - RUST_LOG=zenoh_plugin_ros2dds=debug,zenoh_bridge_ros2dds=info
    volumes:
      - ./config/zenoh/workstation.json5:/etc/zenoh/config.json5:ro
    command: ["-c", "/etc/zenoh/config.json5"]

  robot_zenoh_bridge:
    profiles: ["robot"]
    image: eclipse/zenoh-bridge-ros2dds:latest
    container_name: robot-zenoh-bridge-ros2dds
    network_mode: host
    restart: unless-stopped
    environment:
      - ROS_DISTRO=jazzy
    volumes:
      - ./config/zenoh/robot.json5:/config.json5:ro
    command: ["-c", "/config.json5"]
