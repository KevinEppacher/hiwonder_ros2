services:
  motion_container:
    image: lerobot-ros2-motion-dev:jazzy
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile.motion
    container_name: lerobot_ros2_motion_container
    privileged: true
    network_mode: host
    command: /bin/bash
    tty: true
    ipc: host
    working_dir: /app
    volumes:
      - ../../motion_ws:/app
      - ../../packages:/packages
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
    environment:
      QT_X11_NO_MITSHM: 1
      DISPLAY: $DISPLAY

  vision_container:
    image: lerobot-ros2-vision-dev:jazzy
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile.vision
    container_name: lerobot_ros2_vision_container
    privileged: true
    network_mode: host
    command: /bin/bash
    tty: true
    ipc: host
    working_dir: /app
    volumes:
      - ../../vision_ws:/app
      - ../../packages:/packages
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
    environment:
      QT_X11_NO_MITSHM: 1
      DISPLAY: $DISPLAY
