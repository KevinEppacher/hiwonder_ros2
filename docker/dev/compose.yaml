services:
  motion_container:
    image: lerobot-ros2-motion-dev:jazzy
    build:
      context: ../motion_ws/.config/dev
      dockerfile: Dockerfile
    container_name: lerobot_ros2_motion_container
    privileged: true
    network_mode: host
    command: /bin/bash
    tty: true
    ipc: host
    volumes:
      - ../../motion_ws:/app
      - ../../packages/lemotion:/app/src/lemotion
      - ../../packages/lemodel:/app/src/lemodel
      - ../../packages/lebringup:/app/src/lebringup
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
    environment:
      QT_X11_NO_MITSHM: 1
      DISPLAY: $DISPLAY

  vision_container:
    image: lerobot-ros2-vision-dev:jazzy
    build:
      context: ../vision_ws/.config/dev
      dockerfile: Dockerfile
    container_name: lerobot_ros2_vision_container
    privileged: true
    network_mode: host
    command: /bin/bash
    tty: true
    ipc: host
    volumes:
      - ../../vision_ws:/app
      - ../../packages/levision:/app/src/levision
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
    environment:
      QT_X11_NO_MITSHM: 1
      DISPLAY: $DISPLAY
