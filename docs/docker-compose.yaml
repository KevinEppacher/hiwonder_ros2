services:
  so101-leader-follower-bringup:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    restart: unless-stopped
    devices:
      - ${LEADER_PORT}:/dev/so101_leader
      - ${FOLLOWER_PORT}:/dev/so101_follower
    volumes:
      - ./config:/config:ro
    environment:
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
    command:
      [
        "ros2",
        "launch",
        "lerobot_bringup",
        "so101_leader_follower_bringup.launch.xml",
        "leader_port:=/dev/so101_leader",
        "follower_port:=/dev/so101_follower",
        "leader_calibration_path:=/config/leader_example_calibration.yaml",
        "follower_calibration_path:=/config/follower_example_calibration.yaml",
        "gui:=false"
      ]

  lerobot-teleop:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    depends_on:
      - so101-leader-follower-bringup
    environment:
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
    command:
      [
        "ros2",
        "launch",
        "lerobot_teleop",
        "leader_follower_teleop.launch.py"
      ]

  hiwonder-find-port:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    privileged: true
    volumes:
      - /dev:/dev
    command: ["hiwonder-find-port"]

  hiwonder-scan-leader:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    devices:
      - ${LEADER_PORT}:/dev/hiwonder
    command: ["hiwonder-scan", "/dev/hiwonder"]

  hiwonder-scan-follower:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    devices:
      - ${FOLLOWER_PORT}:/dev/hiwonder
    command: ["hiwonder-scan", "/dev/hiwonder"]

  hiwonder-setup-motors-leader:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    devices:
      - ${LEADER_PORT}:/dev/hiwonder
    command: ["hiwonder-setup-motors", "/dev/hiwonder"]

  hiwonder-setup-motors-follower:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    devices:
      - ${FOLLOWER_PORT}:/dev/hiwonder
    command: ["hiwonder-setup-motors", "/dev/hiwonder"]

  lerobot-calibrate-leader:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    devices:
      - ${LEADER_PORT}:/dev/hiwonder
    volumes:
      - ./config:/config
    command:
      [
        "lerobot-calibrate",
        "/dev/hiwonder",
        "/config/leader_example_calibration.yaml"
      ]

  lerobot-calibrate-follower:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    devices:
      - ${FOLLOWER_PORT}:/dev/hiwonder
    volumes:
      - ./config:/config
    command:
      [
        "lerobot-calibrate",
        "/dev/hiwonder",
        "/config/follower_example_calibration.yaml"
      ]

  lerobot-test-move-leader:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    devices:
      - ${LEADER_PORT}:/dev/hiwonder
    command: ["lerobot-test-move", "/dev/hiwonder"]

  lerobot-test-move-follower:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    devices:
      - ${FOLLOWER_PORT}:/dev/hiwonder
    command: ["lerobot-test-move", "/dev/hiwonder"]

  lerobot-torque-mode-leader:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    devices:
      - ${LEADER_PORT}:/dev/hiwonder
    command: ["lerobot-torque-mode", "/dev/hiwonder"]

  lerobot-torque-mode-follower:
    image: ghcr.io/kevineppacher/lerobot-ros2-motion:jazzy
    network_mode: host
    devices:
      - ${FOLLOWER_PORT}:/dev/hiwonder
    command: ["lerobot-torque-mode", "/dev/hiwonder"]
