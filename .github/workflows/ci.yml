name: Continuous Integration

on:
  push:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build docker container image."
        type: boolean
        required: true
        default: false

jobs:
  check-spelling:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Spell Check Repo
        uses: crate-ci/typos@v1.46.3

  ament__tests:
    runs-on: ubuntu-24.04
    needs: check-spelling

    env:
      IMAGE_NAME: ros2-container_image-${{ github.run_id }}
      CONTAINER_NAME: ros2-test-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build Image
        if: ${{ github.event.inputs.force_build == 'false' || github.event_name == 'push' }}
        run: |
          docker build \
            -f motion_ws/.config/ci/Dockerfile \
            -t $IMAGE_NAME \
            .

      - name: Build Image without Cache
        if: ${{ github.event.inputs.force_build == 'true' }}
        run: |
          docker build \
            --no-cache \
            -f motion_ws/.config/ci/Dockerfile \
            -t $IMAGE_NAME \
            .

      - name: Run Ament Lint Tests
        run: |
          docker run --rm \
            --name $CONTAINER_NAME \
            -v "$(pwd)/motion_ws:/app:rw" \
            -v "$(pwd)/packages:/packages:rw" \
            -v "$(pwd)/motion_ws/.config/ci:/app/ci:ro" \
            $IMAGE_NAME \
            /app/ci/bash_scripts/run_lint_tests.sh

      - name: Build ROS 2 Workspace
        run: |
          docker run --rm \
            --name $CONTAINER_NAME \
            -v "$(pwd)/motion_ws:/app:rw" \
            -v "$(pwd)/packages:/packages:rw" \
            -v "$(pwd)/motion_ws/.config/ci:/app/ci:ro" \
            $IMAGE_NAME \
            /app/ci/bash_scripts/build_ws.sh

      - name: Run Ament Unit Tests
        run: |
          docker run --rm \
            --name $CONTAINER_NAME \
            -v "$(pwd)/motion_ws:/app:rw" \
            -v "$(pwd)/packages:/packages:rw" \
            -v "$(pwd)/motion_ws/.config/ci:/app/ci:ro" \
            $IMAGE_NAME \
            /app/ci/bash_scripts/run_unit_tests.sh

  vision__tests:
    runs-on: ubuntu-24.04
    needs: check-spelling

    env:
      IMAGE_NAME: ros2-vision-container_image-${{ github.run_id }}
      CONTAINER_NAME: ros2-vision-test-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build Vision CI Image
        run: |
          docker build \
            -f vision_ws/.config/ci/Dockerfile \
            -t "$IMAGE_NAME" \
            .

      - name: Build Vision ROS 2 Workspace
        run: |
          docker run --rm \
            --name "$CONTAINER_NAME" \
            -v "$(pwd)/vision_ws:/app:rw" \
            -v "$(pwd)/packages:/packages:rw" \
            -v "$(pwd)/vision_ws/.config/ci:/app/ci:ro" \
            "$IMAGE_NAME" \
            /app/ci/bash_scripts/build_ws.sh

      - name: Run Vision Lint Tests
        run: |
          docker run --rm \
            --name "$CONTAINER_NAME" \
            -v "$(pwd)/vision_ws:/app:rw" \
            -v "$(pwd)/packages:/packages:rw" \
            -v "$(pwd)/vision_ws/.config/ci:/app/ci:ro" \
            "$IMAGE_NAME" \
            /app/ci/bash_scripts/run_lint_tests.sh

      - name: Run Vision Unit Tests
        run: |
          docker run --rm \
            --name "$CONTAINER_NAME" \
            -v "$(pwd)/vision_ws:/app:rw" \
            -v "$(pwd)/packages:/packages:rw" \
            -v "$(pwd)/vision_ws/.config/ci:/app/ci:ro" \
            "$IMAGE_NAME" \
            /app/ci/bash_scripts/run_unit_tests.sh
