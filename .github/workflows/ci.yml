name: Continuous Integration

on:
  push:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build Docker container images."
        type: boolean
        required: true
        default: false

jobs:
  check-spelling:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Spell Check Repo
        uses: crate-ci/typos@v1.46.3

  motion-tests:
    runs-on: ubuntu-24.04
    needs: check-spelling

    env:
      IMAGE_NAME: lerobot-motion-ci-${{ github.run_id }}
      CONTAINER_NAME: lerobot-motion-test-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build Motion CI Image
        if: ${{ github.event.inputs.force_build == 'false' || github.event_name == 'push' }}
        run: |
          docker build \
            -f motion_ws/.config/ci/Dockerfile \
            -t $IMAGE_NAME \
            .

      - name: Build Motion CI Image without Cache
        if: ${{ github.event.inputs.force_build == 'true' }}
        run: |
          docker build \
            --no-cache \
            -f motion_ws/.config/ci/Dockerfile \
            -t $IMAGE_NAME \
            .

      - name: Run Motion Lint Tests
        run: |
          docker run --rm \
            --name $CONTAINER_NAME \
            -v "$(pwd)/motion_ws:/app:rw" \
            -v "$(pwd)/packages/lemotion:/app/src/lemotion:rw" \
            -v "$(pwd)/packages/lemodel:/app/src/lemodel:rw" \
            -v "$(pwd)/packages/lebringup:/app/src/lebringup:rw" \
            -v "$(pwd)/motion_ws/.config/ci:/app/ci:ro" \
            $IMAGE_NAME \
            /app/ci/bash_scripts/run_lint_tests.sh

      - name: Build Motion Workspace
        run: |
          docker run --rm \
            --name $CONTAINER_NAME \
            -v "$(pwd)/motion_ws:/app:rw" \
            -v "$(pwd)/packages/lemotion:/app/src/lemotion:rw" \
            -v "$(pwd)/packages/lemodel:/app/src/lemodel:rw" \
            -v "$(pwd)/packages/lebringup:/app/src/lebringup:rw" \
            -v "$(pwd)/motion_ws/.config/ci:/app/ci:ro" \
            $IMAGE_NAME \
            /app/ci/bash_scripts/build_ws.sh

      - name: Run Motion Unit Tests
        run: |
          docker run --rm \
            --name $CONTAINER_NAME \
            -v "$(pwd)/motion_ws:/app:rw" \
            -v "$(pwd)/packages/lemotion:/app/src/lemotion:rw" \
            -v "$(pwd)/packages/lemodel:/app/src/lemodel:rw" \
            -v "$(pwd)/packages/lebringup:/app/src/lebringup:rw" \
            -v "$(pwd)/motion_ws/.config/ci:/app/ci:ro" \
            $IMAGE_NAME \
            /app/ci/bash_scripts/run_unit_tests.sh

  vision-tests:
    runs-on: ubuntu-24.04
    needs: check-spelling

    env:
      IMAGE_NAME: lerobot-vision-ci-${{ github.run_id }}
      CONTAINER_NAME: lerobot-vision-test-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build Vision CI Image
        if: ${{ github.event.inputs.force_build == 'false' || github.event_name == 'push' }}
        run: |
          docker build \
            -f vision_ws/.config/ci/Dockerfile \
            -t $IMAGE_NAME \
            .

      - name: Build Vision CI Image without Cache
        if: ${{ github.event.inputs.force_build == 'true' }}
        run: |
          docker build \
            --no-cache \
            -f vision_ws/.config/ci/Dockerfile \
            -t $IMAGE_NAME \
            .

      - name: Run Vision Lint Tests
        run: |
          docker run --rm \
            --name $CONTAINER_NAME \
            -v "$(pwd)/vision_ws:/app:rw" \
            -v "$(pwd)/packages/levision:/app/src/levision:rw" \
            -v "$(pwd)/vision_ws/.config/ci:/app/ci:ro" \
            $IMAGE_NAME \
            /app/ci/bash_scripts/run_lint_tests.sh

      - name: Build Vision Workspace
        run: |
          docker run --rm \
            --name $CONTAINER_NAME \
            -v "$(pwd)/vision_ws:/app:rw" \
            -v "$(pwd)/packages/levision:/app/src/levision:rw" \
            -v "$(pwd)/vision_ws/.config/ci:/app/ci:ro" \
            $IMAGE_NAME \
            /app/ci/bash_scripts/build_ws.sh

      - name: Run Vision Unit Tests
        run: |
          docker run --rm \
            --name $CONTAINER_NAME \
            -v "$(pwd)/vision_ws:/app:rw" \
            -v "$(pwd)/packages/levision:/app/src/levision:rw" \
            -v "$(pwd)/vision_ws/.config/ci:/app/ci:ro" \
            $IMAGE_NAME \
            /app/ci/bash_scripts/run_unit_tests.sh
